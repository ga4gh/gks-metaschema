[project]
name = "ga4gh.gks.metaschema"
authors = [
  { name = "Alex Wagner", email = "alex.wagner@nationwidechildrens.org" },
]
readme = "README.md"
description = "GA4GH Genomic Knowledge Standards meta-schema tools"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["bioinformatics", "ga4gh", "genomics", "hgvs", "spdi", "variation"]
requires-python = ">=3.12"
dependencies = ["pyyaml", "Jinja2", "packaging"]
dynamic = ["version"]

[project.optional-dependencies]
tests = ["pytest"]
dev = ["ruff==0.14.10", "prek>=0.2.23"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[project.urls]
Homepage = "https://github.com/ga4gh/gks-metaschema"
Documentation = "https://github.com/ga4gh/gks-metaschema"
Changelog = "https://github.com/ga4gh/gks-metaschema/releases"
Source = "https://github.com/ga4gh/gks-metaschema"
"Bug Tracker" = "https://github.com/ga4gh/gks-metaschema/issues"

[tool.setuptools_scm]

[project.scripts]
jsy2js = "ga4gh.gks.metaschema.scripts.jsy2js:cli"
source2jsy = "ga4gh.gks.metaschema.scripts.source2jsy:cli"
y2t = "ga4gh.gks.metaschema.scripts.y2t:cli"
source2mergedjsy = "ga4gh.gks.metaschema.scripts.source2mergedjsy:cli"
source2splitjs = "ga4gh.gks.metaschema.scripts.source2splitjs:cli"
source2classes = "ga4gh.gks.metaschema.scripts.source2classes:cli"
source2updated = "ga4gh.gks.metaschema.tools.release_prep.schema_versions:cli"
gks-release-prep = "ga4gh.gks.metaschema.tools.release_prep.cli:cli"

[build-system]
requires = ["setuptools>=65.3", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.ruff]
src = ["src"]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # unused
  "AIR",
  "ERA",
  "YTT",
  "BLE",
  "FBT",
  "CPY",
  "DJ",
  "EXE",
  "FIX",
  "FA",
  "PYI",
  "TD",
  "C90",
  "NPY",
  "PD",
  # ignore for compatibility with formatter
  "D206",
  "D300",
  "W191",
  "E111",
  "E114",
  "E117",
  "E501",
  "W191",
  "S321",
  "COM812",
  "COM819",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  # don't require types on *args, **kwargs
  "ANN002",
  "ANN003",
  # subjective pylint thresholds
  "PLR0904",
  "PLR091",
  "PLR1702",
  "PLC0206",
  # misc unnecessary stuff
  "S321",
  "D203",
  "D205",
  "D213",
  "D400",
  "D415",
]

[tool.ruff.lint.per-file-ignores]
# ANN001 - missing-type-function-argument
# ANN2 - missing-return-type
# D100 - undocumented-public-module
# D102 - undocumented-public-class
# D103 - undocumented-public-function
# S101 - assert
# B011 - assert-false
# INP001 - implicit-namespace-package
# PLR2004 - magic-value-comparison
"tests/*" = ["ANN001", "ANN2", "D", "S101", "B011", "INP001", "PLR2004"]
"src/ga4gh/gks/metaschema/scripts/release_prep.py" = ["T201"]
"src/ga4gh/gks/metaschema/scripts/source2classes.py" = ["T201"]
"src/ga4gh/gks/metaschema/scripts/update_schema_versions.py" = ["T201"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
docstring-code-format = true
